# LUNA for iOS: XcodeGen project definition.
#
# The .xcodeproj is generated and not checked in. To work on it locally (needs a Mac):
#   brew install xcodegen
#   cd ios && xcodegen generate && open LUNA.xcodeproj
name: LUNA

options:
  bundleIdPrefix: com.luna
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LUNA:
    type: application
    platform: iOS
    sources:
      - path: LUNA
    info:
      path: LUNA/Resources/Info.plist
      properties:
        # Lets playback continue with the screen locked or the app in the background.
        UIBackgroundModes:
          - audio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luna.music
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: LUNA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LUNAUnitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/LUNAUnitTests
    dependencies:
      - target: LUNA
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luna.music.unittests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LUNA:
    build:
      targets:
        LUNA: all
    test:
      targets:
        - LUNAUnitTests
