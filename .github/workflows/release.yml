name: Release

# Publishes the signed Android APK and an unsigned iOS IPA to GitHub Releases whenever a version tag is pushed.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          LUNA_KEYSTORE_BASE64: ${{ secrets.LUNA_KEYSTORE_BASE64 }}
          LUNA_KEYSTORE_PASSWORD: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          LUNA_KEY_ALIAS: ${{ secrets.LUNA_KEY_ALIAS }}
          LUNA_KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
        run: |
          if [ -z "$LUNA_KEYSTORE_BASE64" ]; then
            echo "::error::Signing secrets are missing; refusing to publish an unsigned APK."
            exit 1
          fi
          printf '%s' "$LUNA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luna.jks"
          echo "LUNA_KEYSTORE_PATH=$RUNNER_TEMP/luna.jks" >> "$GITHUB_ENV"
          {
            printf 'LUNA_KEYSTORE_PASSWORD=%s\n' "$LUNA_KEYSTORE_PASSWORD"
            printf 'LUNA_KEY_ALIAS=%s\n' "$LUNA_KEY_ALIAS"
            printf 'LUNA_KEY_PASSWORD=%s\n' "$LUNA_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Set version from the tag
        run: |
          # v0.2.0 -> versionName 0.2.0. versionCode rises every run so updates install over old versions.
          echo "LUNA_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "LUNA_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease --console=plain

      - name: Verify signature and name the file
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "LUNA-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Install
          1. Download the `.apk` below on your Android phone (Android 8.0+).
          2. Open it. If asked, allow installs from your browser or file manager.
          3. If Play Protect says "unrecognized app", tap **More details → Install anyway**. LUNA is open source and signed with the developer's own key.

          Updates install straight over the previous version.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "LUNA-${GITHUB_REF_NAME}.apk" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "LUNA-${GITHUB_REF_NAME}.apk" \
              --title "LUNA ${GITHUB_REF_NAME}" --notes-file notes.md --generate-notes
          fi

  ios-unsigned-ipa:
    name: Build unsigned iOS IPA
    needs: release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build unsigned iOS app
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project LUNA.xcodeproj \
            -scheme LUNA \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/LUNA-DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA and checksum
        run: |
          APP="$RUNNER_TEMP/LUNA-DerivedData/Build/Products/Release-iphoneos/LUNA.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/LUNA.app"
          IPA="$RUNNER_TEMP/LUNA-${GITHUB_REF_NAME}-unsigned.ipa"
          (cd "$RUNNER_TEMP/ipa" && ditto -c -k --sequesterRsrc --keepParent Payload "$IPA")
          shasum -a 256 "$IPA" > "$IPA.sha256"
          echo "IPA_PATH=$IPA" >> "$GITHUB_ENV"

      - name: Attach unsigned IPA to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            "$IPA_PATH" "$IPA_PATH.sha256" --clobber
