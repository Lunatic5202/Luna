name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          LUNA_KEYSTORE_BASE64: ${{ secrets.LUNA_KEYSTORE_BASE64 }}
          LUNA_KEYSTORE_PASSWORD: ${{ secrets.LUNA_KEYSTORE_PASSWORD }}
          LUNA_KEY_ALIAS: ${{ secrets.LUNA_KEY_ALIAS }}
          LUNA_KEY_PASSWORD: ${{ secrets.LUNA_KEY_PASSWORD }}
        run: |
          if [ -n "$LUNA_KEYSTORE_BASE64" ]; then
            printf '%s' "$LUNA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luna.jks"
            echo "LUNA_KEYSTORE_PATH=$RUNNER_TEMP/luna.jks" >> "$GITHUB_ENV"
            {
              printf 'LUNA_KEYSTORE_PASSWORD=%s\n' "$LUNA_KEYSTORE_PASSWORD"
              printf 'LUNA_KEY_ALIAS=%s\n' "$LUNA_KEY_ALIAS"
              printf 'LUNA_KEY_PASSWORD=%s\n' "$LUNA_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            echo "No signing key configured; the release APK will be unsigned."
          fi

      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain > build.log 2>&1
          status=$?
          msg=$(grep -E '^e: ' build.log | head -45 | sed 's/^e: file:\/\/\/home\/runner\/work\/[^/]*\/[^/]*\///' | sed 's/$/%0A/' | tr -d '\n')
          echo "::error title=Kotlin errors::${msg}"
          if [ "$status" -ne 0 ]; then
            echo "::group::Gradle build.log (last 160 lines)"
            tail -n 160 build.log
            echo "::endgroup::"
          fi
          exit $status

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: luna-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK (smooth, install this one)
        uses: actions/upload-artifact@v7
        with:
          name: luna-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14
