name: Android build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing key
        env:
          LUNA_KEYSTORE_BASE64: ${{ secrets.LUNA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LUNA_KEYSTORE_BASE64" ]; then
            echo "$LUNA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/luna.jks"
            echo "LUNA_KEYSTORE_PATH=$RUNNER_TEMP/luna.jks" >> "$GITHUB_ENV"
            echo "LUNA_KEYSTORE_PASSWORD=${{ secrets.LUNA_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "LUNA_KEY_ALIAS=${{ secrets.LUNA_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "LUNA_KEY_PASSWORD=${{ secrets.LUNA_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "No signing key configured; the release APK will be unsigned."
          fi

      - name: Assemble debug APK
        run: |
          set +e
          ./gradlew :app:lintDebug :app:assembleDebug :app:assembleRelease --console=plain > build.log 2>&1
          status=$?
          msg=$(grep -E '^e: ' build.log | head -45 | sed 's/^e: file:\/\/\/home\/runner\/work\/[^/]*\/[^/]*\///' | sed 's/$/%0A/' | tr -d '\n')
          echo "::error title=Kotlin errors::${msg}"
          exit $status

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: luna-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed release APK (smooth, install this one)
        uses: actions/upload-artifact@v7
        with:
          name: luna-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
          retention-days: 14
