name: iOS build

on:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          # Pin to Xcode 16.4 when the runner image has it; otherwise use the image default.
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          runtimes = json.load(sys.stdin)['devices']
          for runtime in sorted((r for r in runtimes if 'iOS' in r), reverse=True):
              for device in runtimes[runtime]:
                  if device['name'].startswith('iPhone'):
                      print(device['udid'])
                      raise SystemExit
          raise SystemExit('No iPhone simulator available')
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using simulator $UDID"

      - name: Build and run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild test \
            -project LUNA.xcodeproj \
            -scheme LUNA \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RUNNER_TEMP/LUNA.xcresult" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Surface errors
        if: failure()
        run: |
          msg=$(grep -E 'error:|\*\* (BUILD|TEST) FAILED' "$RUNNER_TEMP/build.log" | head -30 | sed 's/^.*\/work\/[^/]*\/[^/]*\///' | sed 's/$/%0A/' | tr -d '\n')
          echo "::error title=iOS build errors::${msg}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LUNA-xcresult
          path: ${{ runner.temp }}/LUNA.xcresult
          if-no-files-found: ignore
